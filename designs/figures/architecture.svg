<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 860" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="decider-architecture-title decider-architecture-desc">
      <title id="decider-architecture-title">Strands Decider architecture: the v1 pointer head and the v2 token readout</title>
      <desc id="decider-architecture-desc">Two versions of the model, each with a prompt that goes through a pretrained LLM torso once and gives one probability for each option, with no text generation. In v1, the hidden states at the last token of each option line and at the answer position go to a pointer head. In v2, the options have the codes A, B and C, and a token readout with one row for each of 255 codes reads the hidden state at the last token of the prompt.</desc>
