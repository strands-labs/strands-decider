# Prices for each host, used by cost.py to compute $/1M decisions.
#
# Prices change. Every entry carries a source URL and the date it was last checked.
# Verify against your actual AWS invoice before quoting.
#
# Hosts with hourly: null are intentionally unpriced:
#   - own hardware (Mac M4 Pro, M3 Pro, RTX 3090) — no per-hour billing
#   - deploy targets without an entry here are skipped in the figure
#
# For AWS Lambda, pricing is per-request + per-GB-second, not hourly;
# cost.py uses the 'lambda' section and the run's recorded tokens/latency.

hosts:
  m4-pro-mlx:
    hourly: null
    note: own hardware
    source: n/a
    checked: 2026-10-26

  m3-pro-mps:
    hourly: null
    note: own hardware
    source: n/a
    checked: 2026-10-26

  rtx-3090-cuda-wsl2:
    hourly: null
    note: own hardware
    source: n/a
    checked: 2026-10-26

  # SageMaker on-demand real-time endpoints, us-east-1.
  # Fill in with the current rate from https://aws.amazon.com/sagemaker-ai/pricing/
  # and set 'checked:' to today's date before quoting.
  sagemaker-ml-g6-xlarge:
    hourly: null  # TODO: NVIDIA L4, 24 GB
    source: https://aws.amazon.com/sagemaker-ai/pricing/
    checked: null

  sagemaker-ml-g5-xlarge:
    hourly: null  # TODO: NVIDIA A10G, 24 GB
    source: https://aws.amazon.com/sagemaker-ai/pricing/
    checked: null

  sagemaker-ml-g6e-xlarge:
    hourly: null  # TODO: NVIDIA L40S, 48 GB
    source: https://aws.amazon.com/sagemaker-ai/pricing/
    checked: null

  sagemaker-ml-p5-4xlarge:
    hourly: null  # TODO: NVIDIA H100, 80 GB
    source: https://aws.amazon.com/sagemaker-ai/pricing/
    checked: null

  sagemaker-ml-m5-2xlarge:
    hourly: null  # TODO: x86 CPU, 8 vCPU / 32 GB
    source: https://aws.amazon.com/sagemaker-ai/pricing/
    checked: null

  sagemaker-ml-c6i-2xlarge:
    hourly: null  # TODO: x86 CPU, 8 vCPU / 16 GB
    source: https://aws.amazon.com/sagemaker-ai/pricing/
    checked: null

# AWS Lambda is request-priced, not hourly. cost.py computes
#   per-request = (per_request_usd) + (gb_second_usd * memory_gb * p50_latency_s)
# and then (per-request) * 1_000_000 is the row in the cost figure.
lambda:
  per_request_usd: null       # TODO: $0.0000002 as of 2024, verify
  gb_second_usd_x86: null     # TODO: $0.0000166667 as of 2024, verify
  gb_second_usd_arm64: null   # TODO: $0.0000133334 as of 2024, verify (not currently supported, see README)
  source: https://aws.amazon.com/lambda/pricing/
  checked: null
