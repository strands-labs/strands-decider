name: llama.cpp shim

# The llama.cpp backend's native library, built and run on CPU: llama.cpp at the pinned commit with
# deploy/lambda/decision/patches, the shim against it, and tests/test_llama_cpp_shim.py, which holds
# it to transformers on a tiny random Gemma 4 decision checkpoint (deploy/lambda/decision/scripts/
# shim_check.py). Also the Lambda stacks' CDK assertions. Optional: it runs on pull requests that
# touch these paths and by hand, and no other check waits for it. No GPU and no secrets.

on:
  workflow_dispatch:
  pull_request:
    branches: [main, staging]
    paths:
      - 'deploy/lambda/**'
      - 'src/strands_decider/backends/**'
      - 'src/strands_decider/core/**'
      - 'tests/test_llama_cpp_shim.py'
      - '.github/workflows/llama-cpp-shim.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  shim:
    name: llama.cpp shim (cpu)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      # The versions the Lambda image converts with; torch from its CPU index.
      - run: python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - run: >-
          python -m pip install numpy==2.5.4 transformers==5.20.2 safetensors==0.8.0
          sentencepiece==0.2.1 "protobuf>=4.21,<5" pyyaml==6.0.3 tqdm==4.70.1 tokenizers==0.23.2
          pillow==13.0.0 pydantic==2.14.3 pytest
      - name: Build llama.cpp and the shim
        run: sh deploy/lambda/decision/scripts/build_native.sh "$RUNNER_TEMP/llama.cpp" "$RUNNER_TEMP/llama-build"
      - name: Run the shim against transformers
        env:
          PYTHONPATH: src
          STRANDS_DECIDER_LLAMA_CPP: ${{ runner.temp }}/llama.cpp
          STRANDS_DECIDER_LLAMA_LIB: ${{ runner.temp }}/llama-build/libdecision.so
          STRANDS_DECIDER_REQUIRE_SHIM: "1"
        run: python -m pytest -q -rs -s tests/test_llama_cpp_shim.py

  cdk:
    name: lambda stacks (cdk assertions)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: deploy/lambda
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: node --version
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm test
