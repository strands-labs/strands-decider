name: tests

on:
  push:
    branches: [main, staging]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'training/**'
      - 'pyproject.toml'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [main, staging]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'training/**'
      - 'pyproject.toml'
      - '.github/workflows/tests.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  cpu:
    name: cpu (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The tested floor versions and the lowest supported Python. The core's request checks
          # are pydantic's and its image headers Pillow's, so both are at their floors.
          - python: "3.11"
            torch: torch==2.7.1
            pins: transformers==5.15.0 peft==0.21.0 huggingface_hub==1.5.0 pydantic==2.7.0 pillow==13.0.0
          # The newest versions that pyproject.toml admits.
          # torchvision runs the 12B's image processor checks (tests/test_core_images.py).
          - python: "3.12"
            torch: torch torchvision
            pins: ""
    env:
      # The suite downloads nothing from the Hub. This setting makes a new download fail.
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      # Install the CPU torch wheel first. The default Linux wheel on PyPI also installs several GB of CUDA libraries.
      - run: python -m pip install ${{ matrix.torch }} --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev]" pytest-cov ${{ matrix.pins }}
      - run: python -m pytest -q --cov=src/strands_decider --cov=training --cov-report=xml
      - name: Upload coverage to Codecov
        # Only from the 3.12 leg: two uploads per push double-count the same coverage.
        # Flagged `cpu` so Codecov merges this with the `mac` upload (different tests
        # cover different lines on the two runners) rather than clobbering it.
        if: matrix.python == '3.12'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: cpu
          fail_ci_if_error: false

  mac:
    # Apple-silicon runner: un-skips the MPS leg of tests/test_mps_kernels.py and the whole
    # tests/test_mlx_engine.py module (both are gated on `platform.system() == "Darwin"` and
    # the mlx extra, or `torch.backends.mps.is_available()`).
    name: mac (py3.12)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,mlx]" torchvision pytest-cov
      - run: python -m pytest -q --cov=src/strands_decider --cov-report=xml
      - name: Upload coverage to Codecov
        # Flagged `mac` so Codecov merges the MPS/MLX lines into the overall report
        # alongside the cpu upload. Each flag's own coverage still shows separately.
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: mac
          fail_ci_if_error: false

  core-tokenizer:
    # The core's render goldens and properties against Gemma 4's real tokenizer, which is
    # not committed (32 MB), so the cpu job skips them. Torch-free, which also shows the core
    # (strands_decider.core) runs without torch. The files at the pinned revision are not
    # gated today; HF_TOKEN is sent when the repository has it, and if Hugging Face ever
    # gates them, a run without the secret (a fork's pull request, say) skips the tests
    # with a warning.
    name: core tokenizer (gemma 4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMMA4_REPO: google/gemma-4-E2B-it
      GEMMA4_REVISION: 3e22461f65e89153144f8adb70e3b8c2cc9845a7
      # tests/core_support.py (GEMMA4_TOKENIZER_SHA256) and tests/test_core_prompt.py (TEMPLATES).
      GEMMA4_TOKENIZER_SHA256: cc8d3a0ce36466ccc1278bf987df5f71db1719b9ca6b4118264f45cb627bfe0f
      GEMMA4_TEMPLATE_SHA256: 0a2c8073c878ab1da004bee933a998606537bbb62016310352c7285c3f01c5b5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Fetch the pinned tokenizer and chat template, and check their sha256
        id: fetch
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/gemma4"
          mkdir -p "$dir"
          auth=()
          if [ -n "${HF_TOKEN:-}" ]; then auth=(-H "Authorization: Bearer $HF_TOKEN"); fi
          for f in tokenizer.json chat_template.jinja; do
            code=$(curl -sSL --retry 3 ${auth[@]+"${auth[@]}"} -o "$dir/$f" -w '%{http_code}' \
              "https://huggingface.co/$GEMMA4_REPO/resolve/$GEMMA4_REVISION/$f")
            if [ "$code" = 401 ] || [ "$code" = 403 ]; then
              if [ -z "${HF_TOKEN:-}" ]; then
                echo "::warning::$GEMMA4_REPO is gated and HF_TOKEN is not set; skipping the core tokenizer tests"
                echo "available=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "::error::HF_TOKEN cannot read $GEMMA4_REPO (HTTP $code)"
              exit 1
            fi
            if [ "$code" != 200 ]; then
              echo "::error::$f: HTTP $code"
              exit 1
            fi
          done
          echo "$GEMMA4_TOKENIZER_SHA256  $dir/tokenizer.json" | sha256sum -c -
          echo "$GEMMA4_TEMPLATE_SHA256  $dir/chat_template.jinja" | sha256sum -c -
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      # No torch. The core needs pydantic, and Pillow for the image tests, pinned here to its
      # floor, 13.0.0. jinja2 and transformers (which runs without torch) un-skip the
      # chat-template and apply_chat_template tests, and N against Gemma4ImageProcessor.
      # The checks that need torchvision or torch (the 12B's processor, Gemma4Processor,
      # v1's decode_image) skip here.
      - if: steps.fetch.outputs.available == 'true'
        run: |
          python -m pip install --no-deps -e .
          python -m pip install numpy tokenizers pytest pydantic jinja2 "transformers>=5.15,<6" pillow==13.0.0
      - if: steps.fetch.outputs.available == 'true'
        env:
          HF_HUB_OFFLINE: "1"
          STRANDS_DECIDER_GEMMA4_TOKENIZER: ${{ steps.fetch.outputs.dir }}/tokenizer.json
          STRANDS_DECIDER_GEMMA4_TEMPLATES: ${{ steps.fetch.outputs.dir }}/chat_template.jinja
        run: |
          python -c "import importlib.util as u, sys; sys.exit(u.find_spec('torch') is not None)"
          python -m pytest -q -rs tests/test_core_prompt.py tests/test_core_readout.py tests/test_core_config.py tests/test_core_images.py
      # The other three Gemma 4 tokenizer.json files (tests/core_support.py, GEMMA4_TOKENIZERS):
      # fetched here, with the token, and tested in the next step, without it. A gated
      # file skips that step with a warning, as the first fetch does.
      - if: steps.fetch.outputs.available == 'true'
        id: fetch_others
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          auth=()
          if [ -n "${HF_TOKEN:-}" ]; then auth=(-H "Authorization: Bearer $HF_TOKEN"); fi
          dirs=()
          while read -r repo revision sha; do
            dir="$RUNNER_TEMP/tokenizers/$sha"
            mkdir -p "$dir"
            code=$(curl -sSL --retry 3 ${auth[@]+"${auth[@]}"} -o "$dir/tokenizer.json" -w '%{http_code}' \
              "https://huggingface.co/$repo/resolve/$revision/tokenizer.json")
            if [ "$code" = 401 ] || [ "$code" = 403 ]; then
              if [ -z "${HF_TOKEN:-}" ]; then
                echo "::warning::$repo is gated and HF_TOKEN is not set; skipping the other tokenizers' tests"
                echo "available=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "::error::HF_TOKEN cannot read $repo (HTTP $code)"
              exit 1
            fi
            if [ "$code" != 200 ]; then
              echo "::error::$repo tokenizer.json: HTTP $code"
              exit 1
            fi
            echo "$sha  $dir/tokenizer.json" | sha256sum -c -
            dirs+=("$dir")
          done <<'EOF'
          google/gemma-4-E2B-it 4adf15748de9e1a0097b6274cee9c15836c41c37 ab26b2add729e6f645bd869f228f14190a06615538f3be6f7786f33d13d78ad2
          google/gemma-4-E4B-it 4ecc2ba63bcac23ba4a767fc87025b1450f84c9c 91d9cf86906f78e197021fda88214d448e5c120665d0243a8e776e046986c6bc
          google/gemma-4-12B-it 43c9d014b231474fa7212dbb48a762566c2b255d 9788bdb6a021b3170357cd3587b5d622b1177561ad3c5bf43d73728fd71aeacb
          EOF
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "dirs=${dirs[*]}" >> "$GITHUB_OUTPUT"
      - if: steps.fetch_others.outputs.available == 'true'
        env:
          HF_HUB_OFFLINE: "1"
          DIRS: ${{ steps.fetch_others.outputs.dirs }}
        run: |
          set -euo pipefail
          for dir in $DIRS; do
            STRANDS_DECIDER_GEMMA4_TOKENIZER="$dir/tokenizer.json" \
              python -m pytest -q -rs tests/test_core_prompt.py tests/test_core_images.py
          done

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      # Uses the detached `lint` hatch env (see pyproject.toml). It skips the project install so torch
      # and other heavy runtime deps stay out of the lint job.
      - run: python -m pip install hatch
      - run: hatch run lint:check
