name: tests

# Companion to tests.yml. Emits jobs with identical names when a PR touches
# nothing under the paths filter, so required status checks still resolve.
on:
  pull_request:
    branches: [main, staging]
    paths-ignore:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/tests.yml'

permissions:
  contents: read

jobs:
  cpu:
    name: cpu (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - run: echo "No src/tests changes; skipping tests."

  mac:
    name: mac (py3.12)
    runs-on: ubuntu-latest
    steps:
      - run: echo "No src/tests changes; skipping tests."

  core-tokenizer:
    name: core tokenizer (gemma 4)
    runs-on: ubuntu-latest
    steps:
      - run: echo "No src/tests changes; skipping the core tokenizer tests."

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - run: echo "No src/tests changes; skipping lint."
