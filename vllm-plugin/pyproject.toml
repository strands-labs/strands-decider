[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strands-decider-v2-vllm"
version = "0.2.1"
description = "Serve Strands Decider v2 (Gemma 4 text decoder, prefix_bidir attention, trained 255-code readout) on stock vLLM 0.33"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["vllm>=0.33.0,<0.34"]

[project.optional-dependencies]
test = ["pytest"]

[project.entry-points."vllm.general_plugins"]
strands_decider_v2 = "strands_decider_v2_vllm:register"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
extend = "../pyproject.toml"

[tool.ruff.lint.per-file-ignores]
# The plugin works through vLLM internals that have no public API (see README, Limits).
"**/*.py" = ["SLF001", "RUF005"]
