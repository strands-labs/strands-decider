[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strands-decider-vllm"
version = "0.3.0"
description = "Serve Strands Decider (Gemma 4, prefix_bidir attention, trained 255-code readout, text and images) on stock vLLM 0.33"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["vllm>=0.33.0,<0.34"]

[project.optional-dependencies]
# The server renders requests with the core library, strands_decider.core. No release has it yet: the floor is the
# development version of PR #129's head with the API the server uses (a checkout installs as 0.3.1.devN when git can
# see its tags), and becomes the first release with the core once that is tagged.
serve = ["strands-decider>=0.3.1.dev106,<0.5", "pillow>=13"]
test = ["pytest"]

[project.scripts]
strands-decider-vllm = "strands_decider_vllm.cli:main"

[project.entry-points."vllm.general_plugins"]
strands_decider = "strands_decider_vllm:register"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
extend = "../pyproject.toml"

[tool.ruff.lint.per-file-ignores]
# The plugin works through vLLM internals that have no public API (see README, Limits).
"**/*.py" = ["SLF001", "RUF005"]
