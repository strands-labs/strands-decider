# strands-decider-E4B-gemma4-v2-2611: Strands Decider v2 E4B, the run-1 one-stage recipe, for training/train.py.
# Source: the finetune section of the v2 run-1 decision_config.json (261111/E4B/run-1).
#   base google/gemma-4-E4B-it, revision ee0ef6023621cff504d758262d4e04895a5af4a2.
# Data: train.jsonl / dev.jsonl (SD-1.31r-legal-strict-v7A-MO, 17,480,385 rows) converted with
#   `python -m training.data.strands_v2`.
# Step math: 30 x 91 = 2,730 rows per optimizer step, independent of the GPU count
#   -> 6,403 steps (ref 6,404; ref per rank batch_size 32, accum 1, token_budget 32,768 on 96 GPUs).
# Sort window 30 x 102 = 3,060; assumed ref 3,072 = world x batch_size x accum (E2B's
#   training_config records sort_window 3,072; the other sizes' were not read).
# slice_char_budget 56000 is the ref token_budget 32,768 at 56,000 characters per 32,768 tokens.
# Not mapped: revision (no key: the host kit pins it); lora.dropout 0.05 (no key; the model's
#   lora_dropout default is 0.05); brier_weight 0.0 (no key); pooling "last" / readout_mode "trained"
#   (what token_readout does); augment true -> shuffle_options.
train_files: ["data/train_examples.jsonl"]
val_files: ["data/dev_examples.jsonl"]   # S3 dev.jsonl
base_model: "google/gemma-4-E4B-it"
head_type: "token_readout"
render: "strands-chat"
attention_mode: "prefix_bidir"
attn_split: 1024        # E2B ref training_config; speed only
max_length: 16384
use_lora: true
lora_r: 64
lora_alpha: 128
lora_targets: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj",
               "per_layer_input_gate", "per_layer_projection"]
head_dropout: 0.0
epochs: 1
micro_batch_size: 30
grad_accum: 91
slice_char_budget: 56000
group_by_length: true
length_group_mega: 102
lr: 1.0e-4
head_lr: 1.0e-4
weight_decay: 0.0
adam_betas: [0.9, 0.999]
warmup_ratio: 0.05
lr_floor: 0.1           # ref: linear warmup, cosine to 0.1x
max_grad_norm: 1.0
gradient_checkpointing: true
shuffle_options: true
ordinal_smoothing: 0.0
reverse_score_prob: 0.0
seed: 20260920
log_every: 1
eval_every: 100
save_every: 100
output_dir: "checkpoints/strands-decider-E4B-gemma4-v2-2611-run1"
