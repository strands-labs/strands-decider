# Base bake-off: one recipe trained from each RAW base (not continuing v19). The configs are
# identical except for the base, its pinned revision, the LoRA target names and the output
# directory (tests/test_configs.py holds that). The recipe is
# v19-yn27b's data and losses on v19's hyperparameters:
#   - v19's train_files, in v19's order (the teacher file indexes into it)
#   - Qwen3.5-27B's distributions on the yes/no rows where it agrees with gold, over v14's
#     replay distributions on the multi-step rows (v19-yn27b's teacher_file;
#     `training/recipe.sh teacher_yn`)
#   - frozen-KL anchor except on yes/no rows; pointer head; LoRA r16
#   - 2,400 optimizer steps at effective batch 32 (~0.64 epoch, 76,800 rows), seed 0.
#     Measured: 0.45 step/s on one H100 for this 2B recipe (Qwen3.5-2B), so ~90 min there;
#     MiniCPM5 does ~1.5x the per-token compute, ~2 h on an H200.
# The decision rule, fixed before any score, and the commands: docs/models/strands-decider-2.5B-minicpm-v21.md#the-base-bake-off.
# Exploratory, not preregistered.
#
# Qwen3.5-2B-Base: hybrid, 18 Gated DeltaNet + 6 attention layers. The control: v19's base.

train_files: ["data/train_v5.jsonl", "data/multistep_v14.jsonl", "data/generated_v16.jsonl",
              "data/generated_v18.jsonl", "data/adequacy_hs2.jsonl", "data/adequacy_gen.jsonl"]
val_fraction: 0.03

base_model: "Qwen/Qwen3.5-2B-Base"
base_revision: "b1485b2fa6dfa1287294f269f5fb618e03d52d7c"
num_slots: 24           # must match `data build --max-options`; also the KL reference width
head_type: "pointer"    # scores each option from its own hidden state; see modeling.PointerHead
pointer_dim: 256
head_init: "random"
kl_frozen_weight: 0.3   # KL(frozen || student) over the option-number readout...
kl_frozen_skip_kinds: ["noul"]   # ...except on yes/no rows
teacher_file: "data/teacher_yn_qwen35-27b.jsonl"
teacher_weight: 1.0
head_dropout: 0.05
max_length: 4096

use_lora: true
lora_r: 16
lora_alpha: 32
# Attention and MLP projections, plus the recurrent layers' own (as v19).
lora_targets: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj",
               "in_proj_qkv", "in_proj_z", "in_proj_a", "in_proj_b", "out_proj"]
freeze_torso: false

epochs: 1
max_steps: 2400         # the bake-off's fixed budget; see the header
micro_batch_size: 8
grad_accum: 4           # effective batch 32
lr: 0.0001              # LoRA
head_lr: 0.001          # randomly-initialised head needs a bigger step
weight_decay: 0.01
warmup_ratio: 0.03
max_grad_norm: 1.0
gradient_checkpointing: true
precompute_frozen_kl: true   # speed only

shuffle_options: true
group_by_length: true
ordinal_smoothing: 0.1
reverse_score_prob: 0.5

output_dir: "checkpoints/bakeoff-qwen35-2b"
seed: 0
log_every: 20
eval_every: 500
