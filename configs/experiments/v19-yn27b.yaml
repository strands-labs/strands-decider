# v19-yn27b: v19 continued for 1,500 steps (~0.4 epoch) on v19's own data, with two
# changes aimed at yes/no decisiveness (v19 answers 48 of JevBench's 74 yes/no tasks
# inside 0.2 < P(yes) < 0.8):
#   - a stronger teacher: Qwen3.5-27B's distributions on the 54,857 yes/no rows of
#     train_v5, generated_v16/v18 and both adequacy sets, kept where they agree with the
#     gold label, over v14's replay distributions on the multi-step rows
#     (python -m strands_decider.data.teacher_yn; `training/recipe.sh teacher_yn`)
#   - no frozen-KL anchor on yes/no rows (kl_frozen_skip_kinds), whose frozen reading is
#     near chance
# Exploratory, three seeds (this file, -seed1, -seed2): the short run of v20's lineage
# (docs/models/strands-decider-2B-hobson-v20.md). checkpoints/v19 is the published v19 at
# its pinned revision.

train_files: ["data/train_v5.jsonl", "data/multistep_v14.jsonl", "data/generated_v16.jsonl",
              "data/generated_v18.jsonl", "data/adequacy_hs2.jsonl", "data/adequacy_gen.jsonl"]
val_fraction: 0.03

base_model: "Qwen/Qwen3.5-2B-Base"
continue_from: "checkpoints/v19"   # adapter and head trainable, calibration reset
num_slots: 24           # must match `data build --max-options`; also the KL reference width
head_type: "pointer"    # scores each option from its own hidden state; see modeling.PointerHead
pointer_dim: 256
head_init: "random"     # unused: continue_from keeps v19's head
kl_frozen_weight: 0.3   # KL(frozen || student) over the option-number readout...
kl_frozen_skip_kinds: ["noul"]   # ...except on yes/no rows
# The 27B's distributions where they agree with gold, over v14's own on the multi-step rows
teacher_file: "data/teacher_yn_qwen35-27b.jsonl"
teacher_weight: 1.0
head_dropout: 0.05
max_length: 4096

use_lora: true
lora_r: 16
lora_alpha: 32
# Attention and MLP projections, plus the recurrent layers' own; without these LoRA
# would reach only the 6 full-attention layers of 24.
lora_targets: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj",
               "in_proj_qkv", "in_proj_z", "in_proj_a", "in_proj_b", "out_proj"]
freeze_torso: false     # true = head-only training (much weaker, but very cheap)

epochs: 1
max_steps: 1500         # ~0.4 epoch at effective batch 32
micro_batch_size: 8
grad_accum: 4           # effective batch 32
lr: 0.0001              # LoRA
head_lr: 0.001          # v19's head step, unchanged
weight_decay: 0.01
warmup_ratio: 0.03
max_grad_norm: 1.0
gradient_checkpointing: true
precompute_frozen_kl: true   # speed only

shuffle_options: true   # the whole point -- do not turn this off
group_by_length: true   # on: ~2k-token documents among ~250-token rows would otherwise
                        # pad most batches; it changes batch composition, not content
ordinal_smoothing: 0.1
reverse_score_prob: 0.5

output_dir: "checkpoints/v19-yn27b"
seed: 0
log_every: 20
eval_every: 500
