# v1's pointer head on Gemma 4 E2B: the settings of v1's released Gemma 4 models
# (configs/v1/strands-decider-E2B-gemma4-v1-2610.yaml) in this trainer's terms. The E4B, 12B and 26B-A4B are the same
# recipe on their bases: give --base-model and --revision (and drop the pins below, which name the E2B). Flags given to
# training.train override any setting. training/README.md, "The pointer head", lists what differs from v1's trainer.
head: pointer
prompt: numbered
base_model: google/gemma-4-E2B-it
revision: 3e22461f65e89153144f8adb70e3b8c2cc9845a7
tokenizer_sha256: cc8d3a0ce36466ccc1278bf987df5f71db1719b9ca6b4118264f45cb627bfe0f
# The base's identity: sha256 of its config.json, tokenizer.json and tensor headers (training/merge.py base_digest)
base_sha256: 2151829a9b033291fa1fb2ad0656a8ddd75fc58b4873f783674e3c77c57070aa
force_bos: true              # the -it tokenizers add no BOS, and Gemma reads a prompt without it badly
targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
rank: 16
alpha: 32
dropout: 0.05
pointer_dim: 256
head_dropout: 0.05
lr: 1.0e-4                   # the adapter
head_lr: 1.0e-3              # the pointer head, which starts random
weight_decay: 0.01           # the head's matrices only
warmup_ratio: 0.03
lr_floor: 0.0                # v1's cosine ends at zero
max_grad_norm: 1.0
brier_weight: 0.0
epochs: 1
rows_per_step: 32            # 8 microbatches of 4 rows: the same steps on 1, 2, 4 or 8 GPUs
batch_size: 4
token_budget: 16384
max_length: 4096             # also the serving window the checkpoint records
reverse_score_prob: 0.5
save_every: 500
eval_every: 500
# The seeds of one model: one run per seed, souped with training.soup, then calibrated (training/README.md).
seeds: [0, 1, 2]
